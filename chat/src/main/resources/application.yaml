spring:
  application:
    name: chat

  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com/v1
      git-hub-models: false
      chat:
        model: gpt-4.1-nano
      embedding:
        model: text-embedding-3-small
    ollama:
      init:
        pull-model-strategy: never
      chat:
        model: hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF
      embedding:
        model: bge-m3
    # elasticsearch 자동 구성은 type=elasticsearch 일 때만 켠다.
    # 로컬에 Elasticsearch가 없으면 simple + in-memory 로 기동한다.
    vectorstore:
      type: simple
      elasticsearch:
        initialize-schema: true
        index-name: spring-ai-document-index
        dimensions: 1536
        similarity: cosine

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

app:
  rag:
    documents-location-pattern: classpath:spring-ai-llm2.pdf
  etl:
    pipeline:
      init: true
  vectorstore:
    in-memory:
      enabled: true
  cli:
    enabled: false
