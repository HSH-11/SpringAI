# 애플리케이션 커스텀 옵션 추가
app:
  cli:
    enabled: false  # CLI 모드 활성화 여부
  chat:
    default-system-prompt: 한국어를 사용하는 tool 지원 AI 입니다.  # 기본 system prompt

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG  # SimpleLoggerAdvisor 등의 Advisor에서 DEBUG 로그 출력
          tool: DEBUG  # Tool 사용 관련 DEBUG 로그 출력

spring:
  application:
    name: tool  # 애플리케이션 이름
  ai:
    mcp:
      client:
        enabled: true  # MCP Client 활성화
        type: SYNC  # MCP Client 타입
        stdio:
          connections:
            #            weather-mcp-server:
            #              # MCP 서버 실행 Python 경로 (프로젝트 venv)
            #              command: c:/Users/user/SpringAI/tool/venv/Scripts/python.exe
            #              args:
            #                - -m
            #                - mcp_weather_server  # MCP 서버 실행 인자
            local-mcp-server:
              command: C:/Program Files/BellSoft/LibericaJDK-17/bin/java.exe
              args:
                - -jar
                - "C:\\Users\\user\\SpringAI\\mcp-server\\build\\libs\\mcp-server-0.0.1-SNAPSHOT.jar"
                - --spring.main.banner-mode=off            # Spring Boot 배너 비활성화
                - --logging.pattern.console=               # 콘솔 로그 패턴 비우기
                - --spring.ai.mcp.server.stdio=true        # STDIO 기반 MCP 서버 활성화
                - --spring.main.web-application-type=none  # 웹 서버 기능 생략 (비웹 모드)
    #            sse:
    #              connections:
    #                local-mcp-server:
    #                  url: http://localhost:8081

    model:
      chat: openai  # 여러 Chat 모델 사용 시 auto-configurations 에서 사용할 모델 설정 필요 예: openai, ollama
    ollama:
      init:
        pull-model-strategy: never
      chat:
        model: hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com/v1
      git-hub-models: false
      chat:
        model: gpt-4.1-nano
