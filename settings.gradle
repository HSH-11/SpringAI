pluginManagement {
    plugins {
        id 'org.springframework.boot' version '4.0.6'
        id 'io.spring.dependency-management' version '1.1.7'
    }
}

rootProject.name = 'SpringAI'

include 'chat'
include 'tool'
include 'mcp-server'

// 실습 모듈은 Spring Boot 버전이 달라 별도 빌드로 연결한다.
[
        'ch6_begin',
        'ch7_begin',
        'ch8_begin',
        'ch9_begin',
        'ch10_begin',
        'ch11_begin',
        'ch12_begin',
        'ch13_begin',
        'ch14_begin',
        'ch15_begin'
].each { chapter ->
    includeBuild("exercise/$chapter")
}
